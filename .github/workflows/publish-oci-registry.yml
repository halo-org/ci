name: Publish to OCI registry

on:
  workflow_call:
    inputs:
      to:
        description: Destination repository, with {name} replaced by each artifact's name.
        type: string
        required: true
      tags:
        description: Tags to publish every artifact under, separated by whitespace.
        type: string
        required: true
      username:
        description: Registry username.
        type: string
        default: ""
      builders:
        description: Remote builders in the Nix machines format, one per line.
        type: string
        default: ""
    secrets:
      password:
        description: Registry password.
        required: false
      builder-ssh-key:
        description: SSH private key for every builder.
        required: false

jobs:
  list:
    name: List
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifacts: ${{ steps.list.outputs.artifacts }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repository
      # This repository, for the scripts.
      - &checkout-workflow
        name: Checkout workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow
      - &install-nix
        name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: List artifacts
        id: list
        working-directory: repository
        run: ../workflow/scripts/list-artifacts.sh
        env:
          TO: ${{ inputs.to }}
          BUILDERS: ${{ inputs.builders }}
          BUILDER_SSH_KEY: ${{ secrets.builder-ssh-key }}

  # One job for each artifact, with the caller's permissions, which the
  # registry may need.
  publish:
    name: ${{ matrix.name }}
    needs: list
    if: needs.list.outputs.artifacts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.artifacts) }}
    steps:
      - *checkout
      - *checkout-workflow
      - *install-nix
      - name: Publish
        working-directory: repository
        run: ../workflow/scripts/publish-artifact.sh
        env:
          KIND: ${{ matrix.kind }}
          DRV: ${{ matrix.drv }}
          OUTPUT: ${{ matrix.output }}
          ATTRIBUTE: ${{ matrix.attribute }}
          REPOSITORY: ${{ matrix.repository }}
          TAGS: ${{ inputs.tags }}
          REGISTRY_USERNAME: ${{ inputs.username }}
          REGISTRY_PASSWORD: ${{ secrets.password }}
          BUILDERS: ${{ inputs.builders }}
          BUILDER_SSH_KEY: ${{ secrets.builder-ssh-key }}
