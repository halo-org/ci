name: Publish to OCI registry

on:
  workflow_call:
    inputs:
      to:
        description: Destination repository, with {name} replaced by each artifact's name.
        type: string
        required: true
      tags:
        description: Tags to push every artifact under, separated by whitespace.
        type: string
        required: true
      username:
        description: Registry username.
        type: string
        default: ""
      builders:
        description: Remote builders in the Nix machines format, one per line.
        type: string
        default: ""
    secrets:
      password:
        description: Registry password.
        required: false
      builder-ssh-key:
        description: SSH private key for every builder.
        required: false

# The calling repository is checked out in repository, and this one, for its
# scripts, in workflow.
defaults:
  run:
    shell: bash
    working-directory: repository

env:
  BUILDERS: ${{ inputs.builders }}

jobs:
  eval:
    name: Evaluate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifacts: ${{ steps.artifacts.outputs.artifacts }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repository
      - &checkout-workflow
        name: Checkout workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow
      - &install-nix
        name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - &set-up-builders
        name: Set up builders
        if: env.BUILDERS != ''
        run: ../workflow/scripts/set-up-builders.sh
        env:
          BUILDER_SSH_KEY: ${{ secrets.builder-ssh-key }}
      - name: Instantiate artifacts
        id: artifacts
        run: ../workflow/scripts/instantiate-artifacts.sh
        env:
          TO: ${{ inputs.to }}
      - name: Upload derivations
        if: env.BUILDERS != ''
        run: ../workflow/scripts/upload-derivations.sh <<< "$ARTIFACTS"
        env:
          ARTIFACTS: ${{ steps.artifacts.outputs.artifacts }}

  # This job has the caller's permissions, which the registry may need.
  publish:
    name: ${{ matrix.name }}
    needs: eval
    if: needs.eval.outputs.artifacts != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.eval.outputs.artifacts) }}
    steps:
      - *checkout
      - *checkout-workflow
      - *install-nix
      - *set-up-builders
      - name: Build
        id: build
        run: ../workflow/scripts/build-artifact.sh
        env:
          STORE: ${{ matrix.store }}
          DRV: ${{ matrix.drv }}
          OUTPUT: ${{ matrix.output }}
          ATTRIBUTE: ${{ matrix.attribute }}
      - name: Push
        run: |
          set -f
          nix run ../workflow#publish-oci-registry -- "$KIND" "$ARTIFACT" "$REPOSITORY" $TAGS
        env:
          KIND: ${{ matrix.kind }}
          ARTIFACT: ${{ steps.build.outputs.path }}
          REPOSITORY: ${{ matrix.repository }}
          TAGS: ${{ inputs.tags }}
          REGISTRY_USERNAME: ${{ inputs.username }}
          REGISTRY_PASSWORD: ${{ secrets.password }}
