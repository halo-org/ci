name: CI

on:
  workflow_call:
    inputs:
      systems:
        description: Systems to build the flake's checks for, as a JSON list.
        type: string
        default: '["x86_64-linux"]'
      builders:
        description: Remote builders in the Nix machines format, one per line.
        type: string
        default: ""
    secrets:
      builder-ssh-key:
        description: SSH private key for every builder.
        required: false

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repository
      # This repository, for the script.
      - name: Checkout workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow
      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Check
        working-directory: repository
        run: ../workflow/scripts/check.sh
        env:
          BUILDERS: ${{ inputs.builders }}
          BUILDER_SSH_KEY: ${{ secrets.builder-ssh-key }}
